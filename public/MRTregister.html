<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRT Testing Details Mod Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pikaday/1.8.0/pikaday.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="LCboxstyles.css">

</head>

<body>
    <!-- Header -->
    <div class="header">
        <img src="logo_new.png" alt="Logo" class="logo" width="180px" height="160px">
        <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
    </div>

    <!-- Navigation bar -->
    <div class="navbar">
        <button id="logoutButton">Logout</button>
    </div>

    <h2>MRT Testing Details Schedule Page</h2>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Serial No</th>
                    <th>Feeder Name</th>
                    <th>Last Tested Date</th>
                    <th>Scheduled Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here by JavaScript -->
            </tbody>
        </table>
    </div>

    <button class="add-button">Add New Feeder</button>

    <div id="modal-overlay" class="modal-overlay">
        <div class="form-container">
            <button class="close-button">&times;</button>
            <form id="edit-form">
                <label for="feeder-name">Feeder Name:</label>
                <input type="text" id="feeder-name" name="feederName" required>

                <label for="last-tested-date">Last Tested Date:</label>
                <input type="date" id="last-tested-date" name="lastTestedDate" required>

                <label for="scheduled-date">Scheduled Date:</label>
                <input type="date" id="scheduled-date" name="scheduledDate" required>

                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Pending">Pending</option>
                    <option value="Incomplete">Incomplete</option>
                    <option value="Completed">Completed</option>
                </select>

                <label for="remarks">Remarks:</label>
                <input type="text" id="remarks" name="remarks">

                <div class="edit-delete-buttons">
                    <button type="submit" class="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="successPopup" class="popup"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const addButton = document.querySelector(".add-button");
            const modalOverlay = document.querySelector("#modal-overlay");
            const closeButton = document.querySelector(".close-button");
            const editForm = document.querySelector("#edit-form");
            const dataTable = document.querySelector("#data-table tbody");

            let currentEditId = null;

            const formatDate = (date) => moment(date).format("DD-MM-YYYY");

            const applyStatusClass = (status) => {
                return status ? status.toLowerCase().replace(/\s/g, "-") + "-status" : "";
            };

            const fetchData = async () => {
                try {
                    const response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders", {
                        credentials: "include",
                    });

                    if (!response.ok) throw new Error("Network response was not ok");

                    const data = await response.json();
                    console.log("Fetched data:", data);

                    dataTable.innerHTML = ""; // Clear table first

                    if (data.length > 0) {
                        data.forEach((feeder, index) => {
                            const row = document.createElement("tr");
                            row.dataset.id = feeder._id;
                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td>${feeder.feederName}</td>
                                <td>${formatDate(feeder.lastTestedDate)}</td>
                                <td>${formatDate(feeder.scheduledDate)}</td>
                                <td class="${applyStatusClass(feeder.status)}">${feeder.status}</td>
                                <td>${feeder.remarks}</td>
                                <td><button class="edit-button">Edit</button></td>
                                <td><button class="delete-button">Delete</button></td>
                            `;
                            dataTable.appendChild(row);
                        });
                    } else {
                        dataTable.innerHTML = "<tr><td colspan='8'>No data available</td></tr>";
                    }
                } catch (error) {
                    console.error("Error:", error);
                    dataTable.innerHTML = "<tr><td colspan='8'>Error loading data</td></tr>";
                }
            };

            addButton.addEventListener("click", () => {
                currentEditId = null; // Reset edit ID
                editForm.reset(); // Clear form
                modalOverlay.style.display = "flex";
            });

            closeButton.addEventListener("click", () => {
                modalOverlay.style.display = "none";
            });

            editForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(editForm);
                const formObject = Object.fromEntries(formData.entries());

                try {
                    let response;
                    let isEditing = !!currentEditId;

                    if (isEditing) {
                        response = await fetch(`https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders/${currentEditId}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formObject),
                        });
                    } else {
                        response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formObject),
                        });
                    }

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Network response was not ok: ${response.status} ${errorText}`);
                    }

                    const data = await response.json();
                    console.log("Server Response:", data); // Debug API response

                    if (!data || !data._id) {
                        throw new Error("Invalid response data - missing _id");
                    }

                    if (isEditing) {
                        const row = document.querySelector(`tr[data-id="${currentEditId}"]`);
                        if (row) {
                            row.cells[1].textContent = data.feederName || "N/A";
                            row.cells[2].textContent = formatDate(data.lastTestedDate);
                            row.cells[3].textContent = formatDate(data.scheduledDate);
                            row.cells[4].textContent = data.status || "N/A";
                            row.cells[5].textContent = data.remarks || "N/A";
                        }
                        showPopup("Data modified successfully");
                    } else {
                        const rows = document.querySelectorAll("#data-table tbody tr");
                        const newSerialNumber = rows.length + 1; // More robust serial numbering

                        const newRow = document.createElement("tr");
                        newRow.dataset.id = data._id;
                        newRow.innerHTML = `
                            <td>${newSerialNumber}</td>
                            <td>${data.feederName || "N/A"}</td>
                            <td>${formatDate(data.lastTestedDate)}</td>
                            <td>${formatDate(data.scheduledDate)}</td>
                            <td class="${applyStatusClass(data.status)}">${data.status || "N/A"}</td>
                            <td>${data.remarks || "N/A"}</td>
                            <td><button class="edit-button">Edit</button></td>
                            <td><button class="delete-button">Delete</button></td>
                        `;
                        document.querySelector("#data-table tbody").appendChild(newRow);
                        showPopup("Feeder Added Successfully");
                    }

                    document.getElementById("modal-overlay").style.display = "none";
                } catch (error) {
                    console.error("Submit error:", error);
                }
            });

            /** Function to show a popup message **/
            function showPopup(message) {
                const popup = document.getElementById("successPopup");
                popup.textContent = message;
                popup.style.display = "block";

                // Hide popup after 1.5 seconds
                setTimeout(() => {
                    popup.style.display = "none";
                }, 1500);
            }

            document.addEventListener("click", async (e) => {
                if (e.target.classList.contains("delete-button")) {
                    const row = e.target.closest("tr");
                    const id = row.dataset.id;

                    if (confirm("Are you sure you want to delete this item?")) {
                        try {
                            const response = await fetch(`https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders/${id}`, {
                                method: "DELETE",
                            });

                            if (!response.ok) {
                                throw new Error(`Failed to delete: ${response.status} ${response.statusText}`);
                            }

                            const text = await response.text();
                            if (text) {
                                console.log("Server response:", text);
                                try {
                                    JSON.parse(text);
                                } catch {
                                    console.warn("Response is not JSON, but deletion was successful.");
                                }
                            } else {
                                console.warn("Empty response, assuming deletion successful.");
                            }

                            row.remove();
                            showPopup("Feeder Deleted Successfully");

                        } catch (error) {
                            console.error("Delete error:", error);
                        }
                    }
                }
            });

            fetchData(); // Load initial data

        function updateSerialNumbers() {
            const rows = document.querySelectorAll("#data-table tbody tr");
            rows.forEach((row, index) => {
                row.cells[0].textContent = index + 1;
            });
        }

        const preventBack = () => {
            window.history.forward();
        };

        window.onload = function () {
            fetchData();

            fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/api/check-auth", {
                credentials: "include",
            })
                .then((response) => {
                    if (response.status === 401) {
                        window.location.href = "/login.html";
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    window.location.href = "/login.html";
                });

            preventBack();
        };

        window.addEventListener("popstate", preventBack);

        document.getElementById("logoutButton").addEventListener("click", function () {
            fetch("/logout", {
                method: "POST",
                credentials: "include"
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === "Logged out successfully") {
                    window.location.href = "/login.html"; // Redirect to login page
                } else {
                    alert("Error logging out");
                }
            })
            .catch(error => {
                console.error("Error during logout:", error);
            });
        });
    });
</script>
</body>
</html>
