<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Add cache control meta tags -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, private">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MRT Testings</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pikaday/1.8.0/pikaday.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="LCboxstyles.css">
</head>

<body>
    <!-- Header -->
    <div class="header">
        <img src="logo_new.png" alt="Logo" class="logo" width="180px" height="160px">
        <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
    </div>

    <!-- Navigation bar -->
    <div class="navbar">
        <button id="logoutButton">Logout</button>
    </div>

    <button id="test-sms-button">Test SMS</button>
    <button id="test-email-button">Test Email</button>

    <h2>MRT Testing Details Schedule Page</h2>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Serial No</th>
                    <th>Feeder Name</th>
                    <th>Last Tested Date</th>
                    <th>Scheduled Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Last Notified</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here by JavaScript -->
            </tbody>
        </table>
    </div>

    <button class="add-button">Add New Feeder</button>

    <div id="modal-overlay" class="modal-overlay">
        <div class="form-container">
            <button class="close-button">&times;</button>
            <form id="edit-form">
                <label for="feeder-name">Feeder Name:</label>
                <input type="text" id="feeder-name" name="feederName" required>

                <label for="last-tested-date">Last Tested Date:</label>
                <input type="date" id="last-tested-date" name="lastTestedDate" required>

                <label for="scheduled-date">Scheduled Date:</label>
                <input type="date" id="scheduled-date" name="scheduledDate" required>

                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Pending">Pending</option>
                    <option value="Incomplete">Incomplete</option>
                    <option value="Completed">Completed</option>
                </select>

                <label for="remarks">Remarks:</label>
                <input type="text" id="remarks" name="remarks">

                <div class="edit-delete-buttons">
                    <button type="submit" class="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="successPopup" class="popup"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const addButton = document.querySelector(".add-button");
            const modalOverlay = document.querySelector("#modal-overlay");
            const closeButton = document.querySelector(".close-button");
            const editForm = document.querySelector("#edit-form");
            const dataTable = document.querySelector("#data-table tbody");
    
            let currentEditId = null;
    
            const formatDate = (date) => date ? moment(date).format("DD-MM-YYYY") : "N/A";
            const applyStatusClass = (status) => status ? status.toLowerCase().replace(/\s/g, "-") + "-status" : "";
    
            const showPopup = (message, isError = false) => {
                const popup = document.getElementById("successPopup");
                popup.textContent = message;
                popup.className = "popup" + (isError ? " error" : "");
                popup.style.display = "block";
                setTimeout(() => popup.style.display = "none", 1500);
            };
    
            const updateSerialNumbers = () => {
                const rows = document.querySelectorAll("#data-table tbody tr");
                rows.forEach((row, index) => row.cells[0].textContent = index + 1);
            };
    
            const disableInteractions = () => {
                document.querySelectorAll("button, input, select").forEach(element => {
                    element.disabled = true;
                });
                showPopup("Session expired. Redirecting to login...", true);
            };
    
            const checkAuthAndPreventBack = async () => {
                try {
                    const response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/api/check-auth", {
                        credentials: "include",
                    });
                    if (response.status === 401) {
                        disableInteractions();
                        window.location.replace("/login.html");
                        return false;
                    }
                    return true;
                } catch (error) {
                    console.error("Error checking auth:", error);
                    disableInteractions();
                    window.location.replace("/login.html");
                    return false;
                }
            };
    
            const fetchData = async () => {
                if (!(await checkAuthAndPreventBack())) return;
                try {
                    const response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders", {
                        credentials: "include",
                    });
                    if (!response.ok) throw new Error("Network response was not ok");

                    const data = await response.json();
                    dataTable.innerHTML = "";
                    const today = moment().startOf('day'); // Use moment object for comparison
                    const tomorrow = moment().add(1, 'days').startOf('day');

                    const dateRegex = /^\d{2}-\d{2}-\d{4}$/; // DD-MM-YYYY validator

                    if (data.length > 0) {
                        data.forEach((feeder, index) => {
                            const row = document.createElement("tr");
                            row.dataset.id = feeder._id;

                            // Validate and parse scheduledDate
                            const isValidDate = dateRegex.test(feeder.scheduledDate);
                            if (!isValidDate) {
                                console.warn(`Invalid scheduledDate for feeder ${feeder.feederName}: ${feeder.scheduledDate}`);
                            }

                            // Use strict parsing with Moment.js
                            const scheduledMoment = isValidDate ? moment(feeder.scheduledDate, "DD-MM-YYYY", true) : null;

                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td>${feeder.feederName}</td>
                                <td>${feeder.lastTestedDate}</td>
                                <td>${feeder.scheduledDate}</td>
                                <td class="${applyStatusClass(feeder.status)}">${feeder.status}</td>
                                <td>${feeder.remarks || "N/A"}</td>
                                <td>${feeder.lastNotified ? moment(feeder.lastNotified).format("DD-MM-YYYY HH:mm") : "N/A"}</td>
                                <td><button class="edit-button">Edit</button></td>
                                <td><button class="delete-button">Delete</button></td>
                            `;

                            // Compare dates using Moment objects
                            if (isValidDate && scheduledMoment.isSame(tomorrow, 'day') && ["Pending", "Incomplete"].includes(feeder.status)) {
                                row.classList.add("scheduled-tomorrow");
                            }
                            if (isValidDate && feeder.status === "Incomplete" && scheduledMoment.isBefore(today, 'day')) {
                                row.classList.add("overdue-incomplete");
                            }
                            dataTable.appendChild(row);
                        });
                    } else {
                        dataTable.innerHTML = "<tr><td colspan='9'>No data available</td></tr>";
                    }
                } catch (error) {
                    console.error("Error:", error);
                    dataTable.innerHTML = "<tr><td colspan='9'>Error loading data</td></tr>";
                }
            };
    
            dataTable.addEventListener("click", async (e) => {
                if (!(await checkAuthAndPreventBack())) return;
                if (e.target.classList.contains("edit-button")) {
                    const row = e.target.closest("tr");
                    currentEditId = row.dataset.id;
                    const feederName = row.cells[1].textContent;
                    const lastTestedDate = row.cells[2].textContent;
                    const scheduledDate = row.cells[3].textContent;
                    const status = row.cells[4].textContent;
                    const remarks = row.cells[5].textContent;
    
                    document.getElementById("feeder-name").value = feederName;
                    document.getElementById("last-tested-date").value = moment(lastTestedDate, "DD-MM-YYYY").format("YYYY-MM-DD");
                    document.getElementById("scheduled-date").value = moment(scheduledDate, "DD-MM-YYYY").format("YYYY-MM-DD");
                    document.getElementById("status").value = status.trim();
                    document.getElementById("remarks").value = remarks === "N/A" ? "" : remarks;
    
                    modalOverlay.style.display = "flex";
                } else if (e.target.classList.contains("delete-button")) {
                    const row = e.target.closest("tr");
                    const feederId = row.dataset.id;
    
                    if (confirm("Are you sure you want to delete this feeder?")) {
                        try {
                            const response = await fetch(`https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders/${feederId}`, {
                                method: "DELETE",
                                credentials: "include",
                            });
                            if (!response.ok) throw new Error("Network response was not ok");
    
                            row.remove();
                            updateSerialNumbers();
                            showPopup("Feeder deleted successfully!");
                        } catch (error) {
                            console.error("Error:", error);
                            showPopup("Error deleting feeder", true);
                        }
                    }
                }
            });
    
            addButton.addEventListener("click", async () => {
                if (!(await checkAuthAndPreventBack())) return;
                currentEditId = null;
                editForm.reset();
                modalOverlay.style.display = "flex";
            });
    
            closeButton.addEventListener("click", () => {
                modalOverlay.style.display = "none";
            });
    
            editForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                if (!(await checkAuthAndPreventBack())) return;
                const formData = new FormData(editForm);
                const formObject = Object.fromEntries(formData.entries());
    
                formObject.lastTestedDate = moment(formObject.lastTestedDate).format("DD-MM-YYYY");
                formObject.scheduledDate = moment(formObject.scheduledDate).format("DD-MM-YYYY");
    
                try {
                    let response;
                    let isEditing = !!currentEditId;
    
                    if (isEditing) {
                        response = await fetch(`https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders/${currentEditId}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formObject),
                            credentials: "include",
                        });
                        showPopup("Feeder updated successfully!");
                    } else {
                        response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formObject),
                            credentials: "include",
                        });
                        showPopup("Feeder added successfully!");
                    }
    
                    if (!response.ok) throw new Error("Network response was not ok");
    
                    modalOverlay.style.display = "none";
                    fetchData();
                } catch (error) {
                    console.error("Error:", error);
                    showPopup("Error saving feeder", true);
                }
            });
    
            document.getElementById("test-sms-button").addEventListener("click", async () => {
                if (!(await checkAuthAndPreventBack())) return;
                try {
                    const response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/test-sms", { credentials: "include" });
                    if (response.ok) showPopup("SMS test triggered!");
                    else throw new Error("SMS test failed");
                } catch (error) {
                    showPopup("Error triggering SMS test", true);
                }
            });
    
            document.getElementById("test-email-button").addEventListener("click", async () => {
                if (!(await checkAuthAndPreventBack())) return;
                try {
                    const response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/test-email", { credentials: "include" });
                    if (response.ok) showPopup("Email test triggered!");
                    else throw new Error("Email test failed");
                } catch (error) {
                    showPopup("Error triggering email test", true);
                }
            });
    
            window.onload = async function () {
                if (!(await checkAuthAndPreventBack())) return;
                fetchData();
            };
    
            setInterval(checkAuthAndPreventBack, 5000);
    
            history.pushState(null, null, window.location.href);
            window.addEventListener("popstate", function () {
                history.pushState(null, null, window.location.href);
                checkAuthAndPreventBack();
            });
    
            document.getElementById("logoutButton").addEventListener("click", async function () {
                console.log("Logout button clicked"); // Debug log
                try {
                    const response = await fetch("/logout", {
                        method: "POST",
                        credentials: "include"
                    });

                    console.log("Logout response:", response); // Debug log
                    if (response.ok) {
                        console.log("Logout successful"); // Debug log
                        alert("Logout successful.");
                        window.location.href = "/login";
                    } else {
                        console.error("Logout failed:", response.statusText); // Debug log
                        alert("Logout failed. Please try again.");
                    }
                } catch (error) {
                    console.error("Logout error:", error); // Debug log
                    alert("An error occurred during logout. Please try again.");
                }
            });
        });
    </script>
</body>
</html>
