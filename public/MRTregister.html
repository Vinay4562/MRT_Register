<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRT Testing Details Mod Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pikaday/1.8.0/pikaday.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="LCboxstyles.css">
</head>

<body>
    <!-- Header -->
    <div class="header">
        <img src="logo_new.png" alt="Logo" class="logo" width="180px" height="160px">
        <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
    </div>

    <!-- Navigation bar -->
    <div class="navbar">
        <button id="logoutButton">Logout</button>
    </div>

    <h2>MRT Testing Details Schedule Page</h2>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>Serial No</th>
                    <th>Feeder Name</th>
                    <th>Last Tested Date</th>
                    <th>Scheduled Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here by JavaScript -->
            </tbody>
        </table>
    </div>

    <button class="add-button">Add New Feeder</button>

    <div id="modal-overlay" class="modal-overlay">
        <div class="form-container">
            <button class="close-button">&times;</button>
            <form id="edit-form">
                <label for="feeder-name">Feeder Name:</label>
                <input type="text" id="feeder-name" name="feederName" required>

                <label for="last-tested-date">Last Tested Date:</label>
                <input type="date" id="last-tested-date" name="lastTestedDate" required>

                <label for="scheduled-date">Scheduled Date:</label>
                <input type="date" id="scheduled-date" name="scheduledDate" required>

                <label for="status">Status:</label>
                <select id="status" name="status" required>
                    <option value="Pending">Pending</option>
                    <option value="Incomplete">Incomplete</option>
                    <option value="Completed">Completed</option>
                </select>

                <label for="remarks">Remarks:</label>
                <input type="text" id="remarks" name="remarks">

                <div class="edit-delete-buttons">
                    <button type="submit" class="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="successPopup" class="popup"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const addButton = document.querySelector(".add-button");
            const modalOverlay = document.querySelector("#modal-overlay");
            const closeButton = document.querySelector(".close-button");
            const editForm = document.querySelector("#edit-form");
            const dataTable = document.querySelector("#data-table tbody");

            let currentEditId = null;

            const formatDate = (date) => date ? moment(date).format("DD-MM-YYYY") : "N/A";

            const applyStatusClass = (status) => status ? status.toLowerCase().replace(/\s/g, "-") + "-status" : "";

            const fetchData = async () => {
                try {
                    const response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders", {
                        credentials: "include",
                    });

                    if (!response.ok) throw new Error("Network response was not ok");

                    const data = await response.json();
                    console.log("Fetched data:", data);

                    dataTable.innerHTML = ""; // Clear table first

                    if (data.length > 0) {
                        data.forEach((feeder, index) => {
                            const row = document.createElement("tr");
                            row.dataset.id = feeder._id;
                            row.innerHTML = `
                                <td>${index + 1}</td>
                                <td>${feeder.feederName}</td>
                                <td>${formatDate(feeder.lastTestedDate)}</td>
                                <td>${formatDate(feeder.scheduledDate)}</td>
                                <td class="${applyStatusClass(feeder.status)}">${feeder.status}</td>
                                <td>${feeder.remarks || "N/A"}</td>
                                <td><button class="edit-button">Edit</button></td>
                                <td><button class="delete-button">Delete</button></td>
                            `;
                            dataTable.appendChild(row);
                        });
                    } else {
                        dataTable.innerHTML = "<tr><td colspan='8'>No data available</td></tr>";
                    }
                } catch (error) {
                    console.error("Error:", error);
                    dataTable.innerHTML = "<tr><td colspan='8'>Error loading data</td></tr>";
                }
            };

            // Event delegation for edit buttons
            dataTable.addEventListener("click", (e) => {
                if (e.target.classList.contains("edit-button")) {
                    const row = e.target.closest("tr");
                    currentEditId = row.dataset.id; // Set the currentEditId to the row's ID

                    // Populate the form with the row's data
                    const feederName = row.cells[1].textContent;
                    const lastTestedDate = row.cells[2].textContent;
                    const scheduledDate = row.cells[3].textContent;
                    const status = row.cells[4].textContent;
                    const remarks = row.cells[5].textContent;

                    document.getElementById("feeder-name").value = feederName;
                    document.getElementById("last-tested-date").value = moment(lastTestedDate, "DD-MM-YYYY").format("YYYY-MM-DD");
                    document.getElementById("scheduled-date").value = moment(scheduledDate, "DD-MM-YYYY").format("YYYY-MM-DD");
                    document.getElementById("status").value = status.trim();
                    document.getElementById("remarks").value = remarks === "N/A" ? "" : remarks;

                    // Show the modal
                    modalOverlay.style.display = "flex";
                }
            });

            addButton.addEventListener("click", () => {
                currentEditId = null;
                editForm.reset();
                modalOverlay.style.display = "flex";
            });

            closeButton.addEventListener("click", () => {
                modalOverlay.style.display = "none";
            });

            editForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const formData = new FormData(editForm);
                const formObject = Object.fromEntries(formData.entries());

                try {
                    let response;
                    let isEditing = !!currentEditId;

                    if (isEditing) {
                        response = await fetch(`https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders/${currentEditId}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formObject),
                        });
                    } else {
                        response = await fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(formObject),
                        });
                    }

                    if (!response.ok) throw new Error("Network response was not ok");

                    const data = await response.json();
                    console.log("Server Response:", data);

                    modalOverlay.style.display = "none";
                    fetchData();
                } catch (error) {
                    console.error("Error:", error);
                }
            });

            fetchData(); // Load data when the page loads

        function updateSerialNumbers() {
            const rows = document.querySelectorAll("#data-table tbody tr");
            rows.forEach((row, index) => {
                row.cells[0].textContent = index + 1;
            });
        }

        const preventBack = () => {
            window.history.forward();
        };

        window.onload = function () {
            fetchData();

            fetch("https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/api/check-auth", {
                credentials: "include",
            })
                .then((response) => {
                    if (response.status === 401) {
                        window.location.href = "/login.html";
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    window.location.href = "/login.html";
                });

            preventBack();
        };

        window.addEventListener("popstate", preventBack);

        document.getElementById("logoutButton").addEventListener("click", function () {
            if (confirm("Are you sure you want to logout?")) {
                fetch("/logout", {
                    method: "POST",
                    credentials: "include"
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message === "Logged out successfully") {
                        window.location.href = "/login.html";
                    } else {
                        showPopup("Error logging out", true);
                    }
                })
                .catch(error => {
                    console.error("Error during logout:", error);
                    showPopup("Error logging out", true);
                });
            }
        });
    });
</script>
</body>
</html>
