<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MRT Testing Details</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: #fff;
        }

        h2 {
            margin-top: 20px;
            color: #333;
            font-size: 40px;
            text-decoration: underline;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: auto; /* Center align the table */
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center; /* Center align regular cells */
            color: #333; /* Darker font color for better visibility */
        }

        th {
            background-color: #2c3e50;
            color: #fff;
            text-align: center; /* Center align header cells */
            position: relative;
        }

        th input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        /* Status Column Styling */
        td.status-cell {
            border-radius: 5px;
            padding: 8px;
            text-align: center;
            font-weight: bold;
        }

        td.completed-status {
            background-color: #2ecc71;
            color: #fff;
        }

        td.incomplete-status {
            background-color: #e74c3c;
            color: #fff;
        }

        td.pending-status {
            background-color: #f39c12;
            color: #fff;
        }

        .filter-buttons {
            margin-top: 20px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .filter-buttons button {
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .filter-buttons button:hover {
            background-color: red;
        }

        .filter-buttons button:active {
            background-color: #1abc9c;
        }

        /* Search Box Styling */
        .search-box {
            margin-top: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            width: 80%; /* Adjust the width as needed */
        }

        .search-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }

        /* Loader Styling */
        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>

<body>

    <!-- Header -->
  <div class="header">
    <img src="logo_new.png" alt="Logo" class="logo" width="130" height="100">
    <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
  </div>

  <!-- Navigation bar -->
  <div class="navbar">
    <a href='https://400kvssshankarpally.free.nf/' class="active">Home</a>
    <a href="https://400kvssshankarpally.free.nf/underConstruction.html">LC Procedures</a>
    <a href='https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/Displaydata_original.html'>Max-Min data</a>
  </div>

    <h2>MRT Testing Details</h2>

     <!-- Loader -->
     <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
        <button onclick="filterByStatus('all')">All (<span id="all-count">0</span>)</button>
        <button onclick="filterByStatus('completed')">Completed (<span id="completed-count">0</span>)</button>
        <button onclick="filterByStatus('incomplete')">Incomplete (<span id="incomplete-count">0</span>)</button>
        <button onclick="filterByStatus('pending')">Pending (<span id="pending-count">0</span>)</button>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
    </div>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Feeder Names</th>
                <th>Last Tested Date</th>
                <th>Next Testing Date</th>
                <th>Status</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody id="displayTableBody">
            <!-- Data will be populated dynamically using JavaScript -->
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetchData();
        });

        let allData = []; // Store original data globally

        async function fetchData() {
            const loader = document.getElementById("loader");
            const searchBox = document.querySelector(".search-box");
            const dataTable = document.querySelector("table");

            try {
                const response = await fetch('https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders');
                const data = await response.json();
                allData = data; // Store all data globally
                updateTable(allData); // Populate the table initially

                // Hide loader and show table
                loader.style.display = 'none';
                searchBox.style.display = 'flex';
                dataTable.style.display = 'table';
            } catch (error) {
                console.error('Error fetching data:', error);
                loader.style.display = 'none';
            }
        }

        function updateTable(filteredData) {
            const tableBody = document.getElementById("displayTableBody");
            tableBody.innerHTML = ''; // Clear existing rows

            let counts = { all: 0, completed: 0, incomplete: 0, pending: 0 };

            filteredData.forEach((feeder, index) => {
                addRowToDisplayTable(feeder, index + 1); // Ensure serial numbers are correct
                counts.all++;
                let status = feeder.status ? feeder.status.trim().toLowerCase() : '';
                if (counts[status] !== undefined) {
                    counts[status]++;
                }
            });

            // Update filter button counts
            document.getElementById("all-count").textContent = counts.all;
            document.getElementById("completed-count").textContent = counts.completed;
            document.getElementById("incomplete-count").textContent = counts.incomplete;
            document.getElementById("pending-count").textContent = counts.pending;
        }

        function addRowToDisplayTable(data, index) {
            const table = document.getElementById("displayTableBody");
            const newRow = table.insertRow();

            const cell1 = newRow.insertCell(0);
            cell1.textContent = index; // Ensure correct serial number

            const cell2 = newRow.insertCell(1);
            cell2.textContent = data.feederName;

            const cell3 = newRow.insertCell(2);
            cell3.textContent = formatDate(data.lastTestedDate);

            const cell4 = newRow.insertCell(3);
            cell4.textContent = formatDate(data.scheduledDate);

            const cell5 = newRow.insertCell(4);
            cell5.textContent = data.status;
            cell5.className = "status-cell " + data.status.toLowerCase() + "-status";

            const cell6 = newRow.insertCell(5);
            cell6.textContent = data.remarks;
        }

        function updateCounts() {
            let counts = { all: 0, completed: 0, incomplete: 0, pending: 0 };

            allData.forEach(feeder => {
                let status = feeder.status ? feeder.status.trim().toLowerCase() : '';
                counts.all++;
                if (counts[status] !== undefined) {
                    counts[status]++;
                }
            });

            // Update filter button counts
            document.getElementById("all-count").textContent = counts.all;
            document.getElementById("completed-count").textContent = counts.completed;
            document.getElementById("incomplete-count").textContent = counts.incomplete;
            document.getElementById("pending-count").textContent = counts.pending;
        }

        // 🔹 **Filter by Status**
        function filterByStatus(status) {
            let filteredData = allData;
            if (status !== 'all') {
                filteredData = allData.filter(feeder => feeder.status.trim().toLowerCase() === status);
            }
            updateTable(filteredData); // Update table with filtered data
            updateCounts(); // Ensure all filter button counts are updated
        }

        // 🔹 **Search Function**
        document.getElementById("searchInput").addEventListener("input", function () {
            searchData();
        });

        function searchData() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const filteredData = allData.filter(feeder => {
                return Object.values(feeder).some(value => {
                    return String(value).toUpperCase().includes(filter);
                });
            });
            updateTable(filteredData);
        }

        // 🔹 **Format Date**
        function formatDate(dateString) {
            const date = new Date(dateString);
            if (isNaN(date)) return "N/A";
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }
    </script>
</body>

</html>
