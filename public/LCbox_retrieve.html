<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MRT Testing Details</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            color: #fff;
        }

        h2 {
            margin-top: 20px;
            color: #333;
            font-size: 40px;
            text-decoration: underline;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: auto; /* Center align the table */
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center; /* Center align regular cells */
            color: #333; /* Darker font color for better visibility */
        }

        th {
            background-color: #2c3e50;
            color: #fff;
            text-align: center; /* Center align header cells */
            position: relative;
        }

        th input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        /* Status Column Styling */
        td.status-cell {
            border-radius: 5px;
            padding: 8px;
            text-align: center;
            font-weight: bold;
        }

        td.completed-status {
            background-color: #2ecc71;
            color: #fff;
        }

        td.incomplete-status {
            background-color: #e74c3c;
            color: #fff;
        }

        td.pending-status {
            background-color: #f39c12;
            color: #fff;
        }

        .filter-buttons {
            margin-top: 20px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .filter-buttons button {
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .filter-buttons button:hover {
            background-color: red;
        }

        .filter-buttons button:active {
            background-color: #1abc9c;
        }

        /* Search Box Styling */
        .search-box {
            margin-top: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            width: 80%; /* Adjust the width as needed */
        }

        .search-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }

        /* Loader Styling */
        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>

<body>

    <!-- Header -->
  <div class="header">
    <img src="logo_new.png" alt="Logo" class="logo" width="130" height="100">
    <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
  </div>

  <!-- Navigation bar -->
  <div class="navbar">
    <a href='https://400kvssshankarpally.free.nf/' class="active">Home</a>
    <a href="https://400kvssshankarpally.free.nf/underConstruction.html">LC Procedures</a>
    <a href='https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/Displaydata_original.html'>Max-Min data</a>
  </div>

    <h2>MRT Testing Details</h2>

     <!-- Loader -->
     <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
        <button onclick="filterByStatus('all')">All (<span id="all-count">0</span>)</button>
        <button onclick="filterByStatus('completed')">Completed (<span id="completed-count">0</span>)</button>
        <button onclick="filterByStatus('incomplete')">Incomplete (<span id="incomplete-count">0</span>)</button>
        <button onclick="filterByStatus('pending')">Pending (<span id="pending-count">0</span>)</button>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
    </div>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Feeder Names</th>
                <th>Last Tested Date</th>
                <th>Next Testing Date</th>
                <th>Status</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody id="displayTableBody">
            <!-- Data will be populated dynamically using JavaScript -->
        </tbody>
    </table>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetchData();
        });

        let fetchedData = []; // Store fetched data globally

        async function fetchData() {
            const loader = document.getElementById("loader");
            const searchBox = document.querySelector(".search-box");
            const dataTable = document.querySelector("table");

            try {
                const response = await fetch('https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders');
                const data = await response.json();
                fetchedData = data; // Store data globally

                updateTable(fetchedData); // Populate table with all data
                updateFilterCounts(fetchedData); // Update filter button counts

                // Hide loader and show table
                loader.style.display = 'none';
                searchBox.style.display = 'flex';
                dataTable.style.display = 'table';
            } catch (error) {
                console.error('Error fetching data:', error);
                loader.style.display = 'none';
            }
        }

        async function fetchFeeders() {
    try {
        const response = await fetch('/feeders');
        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Invalid data format");
        }

        const feederTable = document.getElementById("feederTableBody");
        feederTable.innerHTML = "";

        data.forEach((feeder, index) => {
            const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${feeder.feederName || 'N/A'}</td>
                    <td>${feeder.lastTestedDate ? new Date(feeder.lastTestedDate).toLocaleDateString() : 'N/A'}</td>
                    <td>${feeder.scheduledDate ? new Date(feeder.scheduledDate).toLocaleDateString() : 'N/A'}</td>
                    <td>${feeder.status || 'N/A'}</td>
                    <td>${feeder.remarks || 'N/A'}</td>
                </tr>
            `;
            feederTable.innerHTML += row;
        });
    } catch (error) {
        console.error("Error fetching feeders:", error);
    }
}

document.addEventListener("DOMContentLoaded", fetchFeeders);


        // Function to populate the table
        function updateTable(filteredData) {
            const tableBody = document.getElementById("displayTableBody");
            tableBody.innerHTML = ''; // Clear table before adding new data

            filteredData.forEach((feeder, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td> <!-- Ensures correct serial numbers -->
                    <td>${feeder.name}</td>
                    <td>${feeder.lastTestedDate}</td>
                    <td>${feeder.nextTestingDate}</td>
                    <td class="status-cell ${getStatusClass(feeder.status)}">${feeder.status}</td>
                    <td>${feeder.remarks}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Function to update filter button counts
        function updateFilterCounts(data) {
            const allCount = data.length;
            const completedCount = data.filter(item => item.status.toLowerCase() === 'completed').length;
            const incompleteCount = data.filter(item => item.status.toLowerCase() === 'incomplete').length;
            const pendingCount = data.filter(item => item.status.toLowerCase() === 'pending').length;

            document.getElementById("all-count").textContent = allCount;
            document.getElementById("completed-count").textContent = completedCount;
            document.getElementById("incomplete-count").textContent = incompleteCount;
            document.getElementById("pending-count").textContent = pendingCount;
        }

        function addRowToDisplayTable(feeder, index) {
            const tableBody = document.getElementById("displayTableBody");
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${feeder.name}</td>
                <td>${feeder.lastTestedDate}</td>
                <td>${feeder.nextTestingDate}</td>
                <td class="status-cell ${getStatusClass(feeder.status)}">${feeder.status}</td>
                <td>${feeder.remarks}</td>
            `;

            tableBody.appendChild(row);
        }

        function getStatusClass(status) {
            switch (status.toLowerCase()) {
                case 'completed': return 'completed-status';
                case 'incomplete': return 'incomplete-status';
                case 'pending': return 'pending-status';
                default: return '';
            }
        }

        function updateCounts() {
            const table = document.getElementById("displayTableBody");
            const rows = table.getElementsByTagName("tr");

            let allCount = 0;
            let completedCount = 0;
            let incompleteCount = 0;
            let pendingCount = 0;

            for (let i = 0; i < rows.length; i++) {
                const statusCell = rows[i].getElementsByClassName("status-cell")[0];
                if (statusCell) {
                    const rowStatus = statusCell.className.split(" ")[1].replace("-status", "");

                    allCount++;
                    if (rowStatus === 'completed') completedCount++;
                    if (rowStatus === 'incomplete') incompleteCount++;
                    if (rowStatus === 'pending') pendingCount++;
                }
            }

            document.getElementById("all-count").textContent = allCount;
            document.getElementById("completed-count").textContent = completedCount;
            document.getElementById("incomplete-count").textContent = incompleteCount;
            document.getElementById("pending-count").textContent = pendingCount;
        }

        // Function to filter data based on status
        function filterByStatus(status) {
            let filteredData;
            if (status === 'all') {
                filteredData = fetchedData; // Show all data
            } else {
                filteredData = fetchedData.filter(feeder => feeder.status.toLowerCase() === status);
            }
            updateTable(filteredData); // Update table with filtered data
        }

        // Call updateCounts when the page loads or data changes
        document.addEventListener("DOMContentLoaded", updateCounts);


        document.getElementById("searchInput").addEventListener("input", function () {
            searchData();
        });

        function searchData() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("displayTableBody");
            const tr = table.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                let display = false;
                const cells = tr[i].getElementsByTagName("td");

                for (let j = 1; j < cells.length; j++) {
                    const td = cells[j];
                    if (td) {
                        const txtValue = td.textContent || td.innerText;
                        if (txtValue.toUpperCase().indexOf(filter) > -1) {
                            display = true;
                            break;
                        }
                    }
                }

                tr[i].style.display = display ? "" : "none";
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }
    </script>
</body>

</html>
