<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>MRT Testing Details</title>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <img src="logo_new.png" alt="Logo" class="logo" width="130" height="100">
        <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
        <button class="hamburger" onclick="openNav()">☰</button>
    </div>

    <!-- Navigation bar -->
    <div class="navbar">
        <a href="https://400kvssshankarpally.free.nf/" class="active">Home</a>
        <a href="https://400kvssshankarpally.free.nf/underConstruction.html">LC Procedures</a>
        <a href="https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/Displaydata_original.html">Max-Min data</a>
    </div>

    <!-- Hamburger Overlay -->
    <div id="myNav" class="overlay">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <div class="overlay-content">
            <a href="https://400kvssshankarpally.free.nf/">Home</a>
            <a href="https://400kvssshankarpally.free.nf/underConstruction.html">LC Procedures</a>
            <a href="https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/Displaydata_original.html">Max-Min data</a>
        </div>
    </div>

    <h2>MRT Testing Details</h2>

    <!-- Loader -->
    <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <!-- Download Button -->
    <div class="download-container">
        <button onclick="downloadPDF()" class="download-btn">
            <i class="fa fa-download"></i> Download PDF
        </button>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
        <button onclick="filterByStatus('all')">All (<span id="all-count">0</span>)</button>
        <button onclick="filterByStatus('completed')">Completed (<span id="completed-count">0</span>)</button>
        <button onclick="filterByStatus('incomplete')">Incomplete (<span id="incomplete-count">0</span>)</button>
        <button onclick="filterByStatus('pending')">Pending (<span id="pending-count">0</span>)</button>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
    </div>

    <!-- Table with Scrollbar -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Feeder Names</th>
                    <th>Last Tested Date</th>
                    <th>Next Testing Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="displayTableBody">
                <!-- Data will be populated dynamically using JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="copy">© 2025 Transmission Corporation of Telangana Limited. All Rights Reserved.</div>
    </footer>

    <script>

        // Hamburger Menu Functions
        function openNav() {
            document.getElementById("myNav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("myNav").style.width = "0";
        }

        document.addEventListener("DOMContentLoaded", function () {
            fetchData(); // Fetch data when the page loads
        });

        let allData = [];

        async function fetchData() {
            const loader = document.getElementById("loader");
            const searchBox = document.querySelector(".search-box");
            const dataTable = document.querySelector(".table-container");

            try {
                loader.style.display = 'block';
                searchBox.style.display = 'none';
                dataTable.style.display = 'none';

                const response = await fetch('https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                allData = data;
                updateTable(allData);

                loader.style.display = 'none';
                searchBox.style.display = 'flex';
                dataTable.style.display = 'block';
            } catch (error) {
                console.error('Error fetching data:', error);
                loader.style.display = 'none';
                alert('Failed to fetch data. Please try again later.');
            }
        }

        function updateTable(filteredData) {
            const tableBody = document.getElementById("displayTableBody");
            tableBody.innerHTML = '';

            const counts = {
                all: filteredData.length,
                completed: 0,
                incomplete: 0,
                pending: 0
            };

            filteredData.forEach((feeder, index) => {
                addRowToDisplayTable(feeder, index + 1);
                const status = feeder.status ? feeder.status.trim().toLowerCase() : '';
                if (counts[status] !== undefined) {
                    counts[status]++;
                }
            });

            updateFilterCounts(counts);
        }

        function addRowToDisplayTable(data, index) {
            const tableBody = document.getElementById("displayTableBody");
            const newRow = tableBody.insertRow();

            const cells = [
                index,
                data.feederName,
                formatDate(data.lastTestedDate),
                formatDate(data.scheduledDate),
                data.status,
                data.remarks || 'N/A'
            ];

            cells.forEach((cellData, cellIndex) => {
                const cell = newRow.insertCell(cellIndex);
                cell.textContent = cellData;
                cell.setAttribute('data-label', document.querySelector('thead th:nth-child(' + (cellIndex + 1) + ')').textContent); // For mobile
                if (cellIndex === 4) {
                    cell.className = `status-cell ${data.status.toLowerCase()}-status`;
                }
            });
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const [day, month, year] = dateString.split('-').map(Number);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return 'Invalid Date';
            const date = new Date(year, month - 1, day);
            if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return 'Invalid Date';
            const formattedDay = String(date.getDate()).padStart(2, '0');
            const formattedMonth = String(date.getMonth() + 1).padStart(2, '0');
            const formattedYear = date.getFullYear();
            return `${formattedDay}-${formattedMonth}-${formattedYear}`;
        }

        function updateFilterCounts(counts) {
            document.getElementById("all-count").textContent = counts.all;
            document.getElementById("completed-count").textContent = counts.completed;
            document.getElementById("incomplete-count").textContent = counts.incomplete;
            document.getElementById("pending-count").textContent = counts.pending;
        }

        function updateCounts() {
            let counts = { all: 0, completed: 0, incomplete: 0, pending: 0 };
            allData.forEach(feeder => {
                let status = feeder.status ? feeder.status.trim().toLowerCase() : '';
                counts.all++;
                if (counts[status] !== undefined) counts[status]++;
            });
            updateFilterCounts(counts);
        }

        function filterByStatus(status) {
            let filteredData = allData;
            if (status !== 'all') {
                filteredData = allData.filter(feeder => feeder.status.trim().toLowerCase() === status);
            }
            updateTable(filteredData);
            updateCounts();
        }

        document.getElementById("searchInput").addEventListener("input", function () {
            searchData();
        });

        function searchData() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const filteredData = allData.filter(feeder => {
                return Object.values(feeder).some(value => String(value).toUpperCase().includes(filter));
            });
            updateTable(filteredData);
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const img = new Image();
            img.src = 'logo_new.png';
            img.onload = function () {
                doc.addImage(img, 'PNG', 80, 5, 50, 30);
                generatePDF(doc);
            };
        }

        function generatePDF(doc) {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("TG TRANSCO", 80, 45);
            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            doc.text("MRT Testing Details", 85, 55);
            let tableBody = document.getElementById("displayTableBody").rows;
            if (tableBody.length === 0) {
                alert("No data available to download!");
                return;
            }
            let data = [];
            let headers = ["S.No", "Feeder Names", "Last Tested Date", "Next Testing Date", "Status", "Remarks"];
            for (let i = 0; i < tableBody.length; i++) {
                let row = tableBody[i].cells;
                let rowData = [];
                for (let j = 0; j < row.length; j++) {
                    rowData.push(row[j].textContent.trim());
                }
                data.push(rowData);
            }
            doc.autoTable({
                head: [headers],
                body: data,
                startY: 65,
                styles: { fontSize: 10 },
                headStyles: { fillColor: [0, 112, 192], textColor: 255 },
            });
            doc.save("MRT_Testing_Details.pdf");
        }
    </script>
</body>

</html>
