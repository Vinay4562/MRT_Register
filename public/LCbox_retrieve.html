<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Include jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>MRT Testing Details</title>

</head>

<body>

    <!-- Header -->
  <div class="header">
    <img src="logo_new.png" alt="Logo" class="logo" width="130" height="100">
    <h1>𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃</h1>
  </div>

  <!-- Navigation bar -->
  <div class="navbar">
    <a href='https://400kvssshankarpally.free.nf/' class="active">Home</a>
    <a href="https://400kvssshankarpally.free.nf/underConstruction.html">LC Procedures</a>
    <a href='https://maxregister-git-main-vinay-kumars-projects-f1559f4a.vercel.app/Displaydata_original.html'>Max-Min data</a>
  </div>

    <h2>MRT Testing Details</h2>

     <!-- Loader -->
     <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>
    
    <!-- Download Button -->
    <div class="download-container">
        <button onclick="downloadPDF()" class="download-btn">
            <i class="fa fa-download"></i> Download PDF
        </button>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
        <button onclick="filterByStatus('all')">All (<span id="all-count">0</span>)</button>
        <button onclick="filterByStatus('completed')">Completed (<span id="completed-count">0</span>)</button>
        <button onclick="filterByStatus('incomplete')">Incomplete (<span id="incomplete-count">0</span>)</button>
        <button onclick="filterByStatus('pending')">Pending (<span id="pending-count">0</span>)</button>
    </div>

    <!-- Search Box -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
    </div>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Feeder Names</th>
                <th>Last Tested Date</th>
                <th>Next Testing Date</th>
                <th>Status</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody id="displayTableBody">
            <!-- Data will be populated dynamically using JavaScript -->
        </tbody>
    </table>

    <!-- Footer Section -->
<footer class="footer">
    <div class="copy">&copy; 2025 Transmission Corporation of Telangana Limited. All Rights Reserved.</div>
</footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetchData(); // Fetch data when the page loads
        });

        let allData = []; // Store original data globally

        // Fetch data from the API
        async function fetchData() {
            const loader = document.getElementById("loader");
            const searchBox = document.querySelector(".search-box");
            const dataTable = document.querySelector("table");

            try {
                loader.style.display = 'block'; // Show loader while fetching data
                searchBox.style.display = 'none'; // Hide search box initially
                dataTable.style.display = 'none'; // Hide table initially

                const response = await fetch('https://mrt-register-git-main-vinay-kumars-projects-f1559f4a.vercel.app/feeders');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                allData = data; // Store all data globally
                updateTable(allData); // Populate the table with fetched data

                // Hide loader and show table and search box
                loader.style.display = 'none';
                searchBox.style.display = 'flex';
                dataTable.style.display = 'table';
            } catch (error) {
                console.error('Error fetching data:', error);
                loader.style.display = 'none';
                alert('Failed to fetch data. Please try again later.');
            }
        }

        // Update the table with filtered data
        function updateTable(filteredData) {
            const tableBody = document.getElementById("displayTableBody");
            tableBody.innerHTML = ''; // Clear existing rows

            // Initialize counts for each status
            const counts = {
                all: filteredData.length,
                completed: 0,
                incomplete: 0,
                pending: 0
            };

            // Add rows to the table and update counts
            filteredData.forEach((feeder, index) => {
                addRowToDisplayTable(feeder, index + 1); // Add row with correct serial number
                const status = feeder.status ? feeder.status.trim().toLowerCase() : '';
                if (counts[status] !== undefined) {
                    counts[status]++;
                }
            });

            // Update filter button counts
            updateFilterCounts(counts);
        }

        // Add a row to the table
        function addRowToDisplayTable(data, index) {
            const tableBody = document.getElementById("displayTableBody");
            const newRow = tableBody.insertRow();

            // Insert cells with data
            const cells = [
                index, // Serial number
                data.feederName,
                formatDate(data.lastTestedDate),
                formatDate(data.scheduledDate),
                data.status,
                data.remarks || 'N/A' // Default to 'N/A' if remarks are empty
            ];

            cells.forEach((cellData, cellIndex) => {
                const cell = newRow.insertCell(cellIndex);
                cell.textContent = cellData;

                // Add class to status cell for styling
                if (cellIndex === 4) { // Status cell
                    cell.className = `status-cell ${data.status.toLowerCase()}-status`;
                }
            });
        }

        // Format date to DD-MM-YYYY
        function formatDate(dateString) {
            if (!dateString) return 'N/A'; // Handle empty dates
            const date = new Date(dateString);
            if (isNaN(date)) return 'Invalid Date';

            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are 0-based
            const year = date.getFullYear();
            return `${day}-${month}-${year}`;
        }

        // Update filter counts in the UI
        function updateFilterCounts(counts) {
            document.getElementById("all-count").textContent = counts.all;
            document.getElementById("completed-count").textContent = counts.completed;
            document.getElementById("incomplete-count").textContent = counts.incomplete;
            document.getElementById("pending-count").textContent = counts.pending;
        }

        function updateCounts() {
            let counts = { all: 0, completed: 0, incomplete: 0, pending: 0 };

            allData.forEach(feeder => {
                let status = feeder.status ? feeder.status.trim().toLowerCase() : '';
                counts.all++;
                if (counts[status] !== undefined) {
                    counts[status]++;
                }
            });

            // Update filter button counts
            document.getElementById("all-count").textContent = counts.all;
            document.getElementById("completed-count").textContent = counts.completed;
            document.getElementById("incomplete-count").textContent = counts.incomplete;
            document.getElementById("pending-count").textContent = counts.pending;
        }

        // 🔹 **Filter by Status**
        function filterByStatus(status) {
            let filteredData = allData;
            if (status !== 'all') {
                filteredData = allData.filter(feeder => feeder.status.trim().toLowerCase() === status);
            }
            updateTable(filteredData); // Update table with filtered data
            updateCounts(); // Ensure all filter button counts are updated
        }

        // 🔹 **Search Function**
        document.getElementById("searchInput").addEventListener("input", function () {
            searchData();
        });

        function searchData() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const filteredData = allData.filter(feeder => {
                return Object.values(feeder).some(value => {
                    return String(value).toUpperCase().includes(filter);
                });
            });
            updateTable(filteredData);
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Add logo
            const img = new Image();
            img.src = 'logo_new.png';

            img.onload = function () {
                doc.addImage(img, 'PNG', 80, 5, 50, 30); // Centered logo
                generatePDF(doc);
            };
        }

        function generatePDF(doc) {
            // Add title below the logo
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("TRANSMISSION CORPORATION OF TELANGANA LIMITED", 40, 45);

            // Add a subtitle
            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            doc.text("MRT Testing Details", 85, 55);

            let tableBody = document.getElementById("displayTableBody").rows;
            if (tableBody.length === 0) {
                alert("No data available to download!");
                return;
            }

            let data = [];
            let headers = ["S.No", "Feeder Names", "Last Tested Date", "Next Testing Date", "Status", "Remarks"];

            // Fetch table data
            for (let i = 0; i < tableBody.length; i++) {
                let row = tableBody[i].cells;
                let rowData = [];
                for (let j = 0; j < row.length; j++) {
                    rowData.push(row[j].textContent.trim());
                }
                data.push(rowData);
            }

            // Table formatting in PDF
            doc.autoTable({
                head: [headers],
                body: data,
                startY: 65, // Adjusted to start after header
                styles: { fontSize: 10 },
                headStyles: { fillColor: [0, 112, 192], textColor: 255 },
            });

            doc.save("MRT_Testing_Details.pdf");
        }
    </script>
</body>

</html>
